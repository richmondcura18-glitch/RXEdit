
name: Build RX Edit APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Extract fixed project
        shell: bash
        run: |
          unzip -q RXEdit_Fixed_Project_v2.zip -d extracted

          PROJECT_DIR="$(dirname "$(find extracted -name settings.gradle.kts -print -quit)")"

          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: Android project not found in the ZIP."
            find extracted -name settings.gradle.kts
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT_DIR"

      - name: Set Java and Kotlin target to 17
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          p = Path(os.environ["PROJECT_DIR"]) / "app" / "build.gradle.kts"
          s = p.read_text()

          if "compileOptions" in s:
              s = re.sub(
                  r"compileOptions\s*\{.*?\}",
                  """compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }""",
                  s,
                  count=1,
                  flags=re.S
              )
          else:
              marker = "    compileSdk = 35"
              if marker not in s:
                  raise SystemExit("Cannot find compileSdk = 35")
              s = s.replace(marker, marker + """

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          """, 1)

          if re.search(r"kotlinOptions\s*\{", s):
              s = re.sub(
                  r"kotlinOptions\s*\{.*?\}",
                  """kotlinOptions {
                  jvmTarget = "17"
              }""",
                  s,
                  count=1,
                  flags=re.S
              )
          elif re.search(r"compilerOptions\s*\{", s):
              s = re.sub(
                  r"jvmTarget\s*\.set\(.*?\)",
                  'jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)',
                  s,
                  count=1
              )
          else:
              s += """

          kotlinOptions {
              jvmTarget = "17"
          }
          """

          p.write_text(s)
          print("Updated Java and Kotlin targets:", p)
          PY

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle --no-daemon -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RXEdit-debug-apk
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
