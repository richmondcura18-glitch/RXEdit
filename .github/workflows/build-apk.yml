name: Build RX Edit APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: |
          unzip -q RXEdit_Fixed_Project_v2.zip -d extracted
          PROJECT_DIR="$(dirname "$(find extracted -name settings.gradle.kts -print -quit)")"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Fix Java and Kotlin targets
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          p = Path(os.environ["PROJECT_DIR"]) / "app" / "build.gradle.kts"
          s = p.read_text()

          # Make Java target 17.
          if "sourceCompatibility = JavaVersion.VERSION_17" not in s:
              s = s.replace(
                  "    compileSdk = 35",
                  '    compileSdk = 35\n\n    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }',
                  1
              )

          # Remove misplaced Kotlin options before adding them inside android { }.
          s = re.sub(r'(?m)^\s*kotlinOptions\s*\{[^}]*\}\s*', '', s)
          match = re.search(r'(?m)^android\s*\{', s)
          if not match:
              raise SystemExit("No android { } block found")
          opening = s.find("{", match.start())
          depth = 0
          closing = None
          for i in range(opening, len(s)):
              if s[i] == "{":
                  depth += 1
              elif s[i] == "}":
                  depth -= 1
                  if depth == 0:
                      closing = i
                      break
          if closing is None:
              raise SystemExit("Android block is not closed")
          s = s[:closing] + '\n    kotlinOptions { jvmTarget = "17" }\n' + s[closing:]
          p.write_text(s)
          print("Updated", p)
          PY

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle --no-daemon -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RXEdit-debug-apk
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
